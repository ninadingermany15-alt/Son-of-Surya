<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surya Mission</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="shared.css">
<script src="sfx.js" defer></script>
<style>
.app{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:12px; padding-block:12px}
@media (max-width:920px){ .app{grid-template-columns:minmax(0,1fr)} }
.stage{position:relative; aspect-ratio:16/9; max-width:100%; border-radius:16px; overflow:hidden; background:#000; box-shadow:0 30px 60px -30px #000}
canvas#scene{position:absolute; inset:0; width:100%; height:100%; display:block}
.hud{position:absolute; top:10px; left:12px; right:12px; display:flex; justify-content:space-between; gap:8px; pointer-events:none; z-index:10; flex-wrap:wrap}
.hud .ss-chip{pointer-events:auto}
.hud button{all:unset; cursor:pointer}
.hud button:focus-visible{outline:2px solid #fff}
.toast{pointer-events:none; position:absolute; top:54px; left:50%; transform:translateX(-50%); z-index:11; background:var(--file); color:var(--fileink); font:16px 'Special Elite', monospace; padding:10px 16px; border-radius:6px; box-shadow:0 10px 30px -10px #000; opacity:0; transition:opacity .25s; max-width:90%; text-align:center}
.toast.show{opacity:1}
.overlay{position:absolute; left:0; right:0; bottom:0; z-index:6; padding:12px; pointer-events:none}
.overlay > *{pointer-events:auto}
.overlay.top{top:52px; bottom:auto}
.dlg{background:linear-gradient(180deg, rgba(9,16,30,0), rgba(9,16,30,.9) 30%); padding:28px 16px 12px; display:flex; gap:14px; align-items:flex-end}
.overlay.top .dlg{background:rgba(9,16,30,.9); border-radius:14px; padding:10px 14px}
.face{flex:0 0 auto; width:84px; height:84px; border-radius:14px; background:var(--panel); border:2px solid var(--sun); overflow:hidden}
.face canvas{width:100%; height:100%; display:block}
.overlay.top .face{width:48px; height:48px}
.bubble{min-width:0; flex:1}
.who{font:700 14px var(--display); color:var(--sun); letter-spacing:.04em}
.say{font-size:17px; line-height:1.5; margin-top:2px; min-height:52px}
.overlay.top .say{min-height:0; font-size:15px}
.choices{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.puz{background:rgba(9,16,30,.93); border:1px solid var(--line); border-radius:14px; padding:14px; display:grid; gap:10px}
.puz h3{margin:0; font:700 16px var(--display); color:var(--sun)}
.puz .q{font-size:15px}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px}
.opt{all:unset; cursor:pointer; background:var(--panel); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.35}
.opt:hover{border-color:var(--sun)} .opt:focus-visible{outline:3px solid #fff}
.opt.ok{border-color:var(--good); background:rgba(16,185,129,.15)} .opt.no{border-color:var(--bad); background:rgba(255,107,107,.12)}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.hint{color:#FFD98A; font-size:14px}
/* picker */
.screen{position:absolute; inset:0; z-index:9; display:grid; place-items:center; padding:12px; background:radial-gradient(ellipse at 70% 15%, rgba(253,166,4,.2), transparent 60%), rgba(10,9,9,.62)}
.screen[hidden]{display:none}
.pick{background:rgba(11,20,36,.94); border:1px solid var(--line); border-radius:18px; padding:18px; width:100%; max-width:880px; max-height:100%; overflow:auto}
.pick h1{font:800 clamp(24px,3.6vw,40px)/1.05 var(--display); margin:0}
.pick h1 em{font-style:normal; color:var(--sun)}
.eyebrow{font:600 12px var(--display); letter-spacing:.14em; text-transform:uppercase; color:var(--sun)}
.steps{display:flex; gap:6px; margin:10px 0; flex-wrap:wrap; font:600 12px var(--display); color:var(--muted)}
.steps span.on{color:var(--sun)}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-top:10px}
.tile{all:unset; cursor:pointer; background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px; display:grid; gap:4px; min-width:0}
.tile:hover,.tile[aria-pressed="true"]{border-color:var(--sun)}
.tile:focus-visible{outline:3px solid #fff}
.tile b{font:700 15px var(--display)}
.tile small{color:var(--muted); font-size:13px; line-height:1.4}
.tile .st{font:600 12px var(--display); color:var(--good)}
.tile canvas{width:64px; height:64px}
.tile .rg{height:56px; border-radius:10px}
.namefield{display:grid; gap:4px; margin-top:12px; font:600 14px var(--display); max-width:340px}
.namefield input{font:16px var(--body); padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--panel); color:#fff}
/* side file */
.file{background:var(--file); color:var(--fileink); border-radius:12px; padding:14px; font-family:'Special Elite','Courier New',monospace; position:relative; min-width:0}
.file h2{font:700 14px var(--display); letter-spacing:.12em; text-transform:uppercase; margin:0 0 4px; color:#6B4E16}
.ptabs{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px}
.ptabs button{all:unset; cursor:pointer; font:600 12px var(--display); padding:5px 9px; border-radius:6px; background:rgba(58,46,26,.1); color:#3A2E1A}
.ptabs button[aria-selected="true"]{background:#6B4E16; color:var(--file)}
.ptabs button:focus-visible{outline:2px solid #6B4E16}
.pp[hidden]{display:none}
.meta{font-size:13px; line-height:1.6}
.file ul{list-style:none; padding:0; margin:10px 0 0; display:grid; gap:7px; font-size:13px}
.file li{border-bottom:1px dashed #BFAE86; padding-bottom:5px}
.file li.lock{opacity:.4}
.it{display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:6px 0; border-bottom:1px dashed #BFAE86}
.it.lock{opacity:.4}
.it b{font:600 12px var(--display)}
.chap{display:grid; gap:3px; margin-top:10px; font:12px var(--display)}
.chap span{padding:3px 8px; border-radius:6px; background:rgba(58,46,26,.08)}
.chap span.on{background:#6B4E16; color:var(--file)} .chap span.done{text-decoration:line-through; opacity:.6}
.badges{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px}
.badge{text-align:center; font:600 11px var(--display); padding:7px 4px; border-radius:8px; background:rgba(58,46,26,.08)}
.badge.lock{opacity:.35} .badge span{display:block; font-size:20px}
.pbtn{all:unset; cursor:pointer; display:inline-block; font:700 12px var(--display); background:#6B4E16; color:var(--file); padding:6px 10px; border-radius:8px}
.cert{position:absolute; inset:0; z-index:12; display:grid; place-items:center; background:rgba(10,9,9,.78); padding:12px}
.cert[hidden]{display:none}
.cert > div{max-height:100%; min-height:0; grid-template-rows:minmax(0,1fr) auto}
.cert canvas{max-width:100%; max-height:100%; width:auto; height:auto; min-height:0; border-radius:8px; box-shadow:0 20px 60px #000}
/* phones: the case picker leaves the small 16:9 stage and gets the full width */
@media (max-width:700px){ .stage:has(#picker:not([hidden])){aspect-ratio:auto; overflow:visible; background:none; box-shadow:none} .stage:has(#picker:not([hidden])) #scene, .stage:has(#picker:not([hidden])) .hud{display:none} #picker{position:static; padding:0; background:none} .pick{max-height:none} .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){ .stage{aspect-ratio:auto} canvas#scene{position:relative; height:auto; aspect-ratio:16/9} .hud{position:static; padding:8px 8px 0; background:var(--navy)} .say{font-size:15px; min-height:40px} .face{width:56px; height:56px} .overlay,.overlay.top{position:static; padding:0} .dlg,.overlay.top .dlg{background:var(--navy); border-radius:0 0 16px 16px} }
.tile.case{padding:0; overflow:hidden} .tile.case .thumb{width:100%; height:auto; display:block; margin:0 0 6px} .tile.case b,.tile.case small,.tile.case .st{padding:0 12px} .tile.case .st{margin-bottom:10px} .tile.case small.tw{color:var(--sun)} .tile.case small.fl{opacity:.75}
</style>
</head>
<body>
<div class="ss-wrap app">
  <div>
    <div class="stage" id="stage">
      <canvas id="scene" width="1280" height="720" aria-label="Animated scene of the solar project"></canvas>
      <div class="hud">
        <span class="ss-chip">Solar Credits <b id="score">100</b></span>
        <span class="ss-chip" id="chapname">Choose a case</span>
        <span class="ss-chip"><button id="voice" type="button" aria-label="Turn character voices on">🗣 Voices off</button>&nbsp;·&nbsp;<button id="mute" type="button" aria-label="Turn sound on">🔇 Sound off</button></span>
      </div>
      <div class="toast" id="toast" role="status"></div>
      <div class="overlay" id="overlay"></div>
      <div class="cert" id="cert" hidden><div style="display:grid; gap:10px; justify-items:center"><canvas id="certc" width="1200" height="800"></canvas><button class="ss-btn" type="button" id="certclose">Close</button></div></div>
      <div class="screen" id="picker"><div class="pick" id="pick"></div></div>
    </div>
    <p class="ss-small" style="margin-top:8px">Game values are realistic approximations for learning. Your progress saves in this browser, and to your Son of Surya account when you sign in.</p>
  </div>
  <aside class="file" aria-label="Player menu">
    <div class="ptabs" role="tablist">
      <button type="button" data-p="case" aria-selected="true">Case</button><button type="button" data-p="inv" aria-selected="false">Inventory</button><button type="button" data-p="tools" aria-selected="false">Tools</button><button type="button" data-p="map" aria-selected="false">World map</button><button type="button" data-p="rew" aria-selected="false">Rewards</button>
    </div>
    <div class="pp" id="pp-case"><h2>Case file</h2><div class="meta" id="casemeta">Pick a region and a case to begin.</div><ul id="clues"></ul><div class="chap" id="chapters"></div></div>
    <div class="pp" id="pp-inv" hidden><h2>Inventory</h2><div id="invlist"></div></div>
    <div class="pp" id="pp-tools" hidden><h2>Toolkit</h2><div id="toollist"></div></div>
    <div class="pp" id="pp-map" hidden><h2>World map</h2><div id="maplist"></div></div>
    <div class="pp" id="pp-rew" hidden><h2>Rewards</h2><div id="rewbox"></div></div>
  </aside>
</div>
<script src="account.js"></script>
<script src="cases.js"></script>
<script src="cases-more.js"></script>
<script src="mission-story.js"></script>
<script>
(()=>{
SS.mountHeader('mission');
const CASES=window.SM_CASES;
/* ================= AUDIO ================= */
let AC=null, master=null, musicOn=false, musicTimer=null, engineNode=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination);}catch(e){} } return AC; }
function tone(f,d=.15,type='sine',v=.2,w=0){ if(!AC||!musicOn) return; const t=AC.currentTime+w,o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05); }
const sfx={ click:()=>tone(660,.08,'triangle',.12), clue:()=>{tone(784,.18,'sine',.18); tone(1046,.3,'sine',.14,.12);}, good:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.16,i*.09)), bad:()=>{tone(180,.3,'sawtooth',.12); tone(140,.35,'sawtooth',.1,.08);}, type:()=>tone(1400+Math.random()*300,.02,'square',.025), win:()=>[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,.5,'triangle',.14,i*.12)) };
const SCALES={India:[261.6,293.7,329.6,392,440,523.3],'Middle East':[261.6,277.2,329.6,349.2,392,415.3],Africa:[261.6,293.7,329.6,392,440,523.3],Europe:[261.6,293.7,329.6,349.2,392,440],Americas:[261.6,293.7,311.1,392,440,466.2],'South-East Asia':[261.6,293.7,329.6,392,440,523.3]};
function startMusic(){ if(!AC) return; stopMusic(); let step=0; const sc=SCALES[(S.case&&S.case.region)||'India'];
  const drone=()=>{ tone(sc[0]/2,3.6,'sine',.05); tone(sc[3]/2,3.6,'sine',.035,.9); }; drone();
  musicTimer=setInterval(()=>{ if(!musicOn) return; if(step%8===0) drone(); if(Math.random()<.75){ const f=sc[Math.floor(Math.random()*sc.length)]*(Math.random()<.3?2:1); tone(f,.6,'triangle',.045);} step++; },450); }
function stopMusic(){ if(musicTimer) clearInterval(musicTimer); musicTimer=null; }
function engine(on){ if(!AC||!musicOn){ if(engineNode){ try{engineNode.stop()}catch(e){} engineNode=null;} return; }
  if(on&&!engineNode){ const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter(); o.type='sawtooth'; o.frequency.value=48; f.type='lowpass'; f.frequency.value=260; g.gain.value=.05; o.connect(f); f.connect(g); g.connect(master); o.start(); engineNode=o; }
  if(!on&&engineNode){ try{engineNode.stop()}catch(e){} engineNode=null; } }
const muteBtn=document.getElementById('mute');
muteBtn.onclick=()=>{ audio(); if(!AC) return; AC.resume&&AC.resume(); musicOn=!musicOn; muteBtn.textContent=musicOn?'🔊 Sound on':'🔇 Sound off'; muteBtn.setAttribute('aria-label',musicOn?'Turn sound off':'Turn sound on'); if(musicOn){ startMusic(); sfx.good(); } else { stopMusic(); engine(false);} };
/* ================= VOICES ================= */
let VOICE=false;
function pickVoice(female,lang){ const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[]; const pref={India:/en-IN|hi-IN/i,'Middle East':/en-(AE|IN|GB)|ar/i,Africa:/en-(KE|ZA|NG|GB)/i,Europe:/en-(GB|IE)|de-DE/i,Americas:/en-US/i,'South-East Asia':/en-(SG|PH|AU|GB)/i}[lang]||/en/i;
  let pool=vs.filter(v=>pref.test(v.lang)); if(!pool.length) pool=vs.filter(v=>/^en/i.test(v.lang)); if(!pool.length) return null;
  const fem=pool.find(v=>/female|veena|lekha|heera|priya|neerja|kalpana|swara|aditi|raveena|zira|samantha|ananya|sonia|libby|jenny|aria|susan/i.test(v.name));
  const mal=pool.find(v=>/(^|\W)male|rishi|hemant|prabhat|ravi|madhur|daniel|david|guy|ryan|george/i.test(v.name)&&!/female/i.test(v.name));
  return female?(fem||pool[0]):(mal||pool[pool.length>1?1:0]); }
function speak(text,p){ if(!VOICE||!window.speechSynthesis) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/₹/g,' rupees ').replace(/·/g,',')); u.pitch=p.pitch||1; u.rate=p.rate||1; const v=pickVoice(p.f,S.case&&S.case.region); if(v){u.voice=v; u.lang=v.lang;} speechSynthesis.speak(u);}catch(e){} }
const vb=document.getElementById('voice'); vb.onclick=()=>{ VOICE=!VOICE; vb.textContent=VOICE?'🗣 Voices on':'🗣 Voices off'; vb.setAttribute('aria-label',VOICE?'Turn character voices off':'Turn character voices on'); if(!VOICE&&window.speechSynthesis) speechSynthesis.cancel(); };
const isFem=c=>!!(c&&(c.saree||c.bun||c.hijab));

/* ================= STATE ================= */
const S={ role:null, name:'', case:null, score:100, clues:new Set(), chapter:-1, scene:'title', t:0, mapT:0, mapping:false, finT:0 };
const ROLES=[
 {id:'eng',name:'Site Engineer',perk:'Free hint: site and wiring',tone:'#10B981',skin:'#C68A5E',hat:'#FDA604',free:['site','wire']},
 {id:'des',name:'Solar Designer',perk:'Free hint: sizing and shadows',tone:'#5AA7FF',skin:'#8D5A3B',hair:'#1a1a1a',free:['size','shadow']},
 {id:'pm',name:'EPC Project Manager',perk:'Free hint: transport and commissioning',tone:'#C792EA',skin:'#B57B52',hair:'#2a1a10',glasses:true,free:['road','comm']},
 {id:'saf',name:'Safety Officer',perk:'Free hint: safety walk',tone:'#FF8A3D',skin:'#9A6644',hat:'#FFFFFF',vest:true,free:['safety']},
 {id:'farm',name:'Farmer',perk:'Free hint: site and weather · Role path: subsidy, payback, care',tone:'#7FB24A',skin:'#8D5A3B',topi:true,moustache:true,free:['site','road']},
 {id:'home',name:'Homeowner',perk:'Free hint: shadows and commissioning · Role path: quote, extra power, papers',tone:'#E07A9B',skin:'#C68A5E',hair:'#1a1a1a',bun:true,bindi:true,free:['shadow','comm']},
 {id:'mfg',name:'Product Manufacturer',perk:'Free hint: wiring and safety · Role path: certificates, site test, warranty',tone:'#8FA3BF',skin:'#B57B52',hair:'#3a2a1a',glasses:true,free:['wire','safety']},
 {id:'stu',name:'Student',perk:'Free hint: sizing and wiring · Role path: kWp, direction, carbon',tone:'#4FC1E9',skin:'#C68A5E',hair:'#1a1a1a',free:['size','wire']}
];
let CH=['Journey','Site investigation','Load analysis','Shadow study','Electrical design','Transport and crew','Safety walk','Commissioning']; let FLOW=null;
const CLUEKEYS=['load','obst','roof','grid','site','climate'];

/* ================= CANVAS ART ================= */
const cv=document.getElementById('scene'), X=cv.getContext('2d'); const W=1280,H=720;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp=(a,b,t)=>a+(b-a)*t;
function sky(c){ const g=X.createLinearGradient(0,0,0,H); g.addColorStop(0,c[0]); g.addColorStop(.55,c[1]); g.addColorStop(1,c[2]); X.fillStyle=g; X.fillRect(0,0,W,H); }
function sun(x,y,r,glow=1){ const g=X.createRadialGradient(x,y,0,x,y,r*4); g.addColorStop(0,'rgba(255,214,120,'+.55*glow+')'); g.addColorStop(1,'rgba(255,214,120,0)'); X.fillStyle=g; X.beginPath(); X.arc(x,y,r*4,0,7); X.fill(); X.fillStyle='#FFD36B'; X.beginPath(); X.arc(x,y,r,0,7); X.fill(); }
function ridge(y,amp,col,off,f=.004){ X.fillStyle=col; X.beginPath(); X.moveTo(0,H); for(let x=0;x<=W;x+=10) X.lineTo(x,y+Math.sin((x+off)*f)*amp+Math.sin((x+off)*f*2.7)*amp*.4); X.lineTo(W,H); X.fill(); }
function peaks(y,col,snow,off=0,n=6,hgt=220){ for(let i=0;i<n;i++){ const x=((i*260+off)%(W+300))-150, h=hgt*(.6+((i*37)%10)/14); X.fillStyle=col; X.beginPath(); X.moveTo(x-180,y); X.lineTo(x,y-h); X.lineTo(x+180,y); X.fill(); if(snow){ X.fillStyle='#F4F7FA'; X.beginPath(); X.moveTo(x-55,y-h+h*.3); X.lineTo(x,y-h); X.lineTo(x+55,y-h+h*.3); X.lineTo(x+20,y-h+h*.24); X.lineTo(x,y-h+h*.34); X.lineTo(x-22,y-h+h*.24); X.fill(); } } }
function palm(x,y,s,sway){ X.save(); X.translate(x,y); X.scale(s,s); X.strokeStyle='#6B4A2B'; X.lineWidth=9; X.lineCap='round'; X.beginPath(); X.moveTo(0,0); X.quadraticCurveTo(10+sway*6,-70,sway*14,-150); X.stroke(); X.translate(sway*14,-150);
  for(let i=0;i<7;i++){ const a=-Math.PI/2+(i-3)*.55+Math.sin(S.t*1.5+i)*.05*(reduce?0:1); X.save(); X.rotate(a); X.fillStyle='#1E5B3A'; X.beginPath(); X.moveTo(0,0); X.quadraticCurveTo(40,-18,88,8); X.quadraticCurveTo(40,-4,0,4); X.fill(); X.restore(); } X.restore(); }
function tree(x,y,s,kind){ X.save(); X.translate(x,y); X.scale(s,s); const sway=Math.sin(S.t*1.2+x)*.04*(reduce?0:1); X.rotate(sway);
  if(kind==='poplar'){ X.fillStyle='#5B4632'; X.fillRect(-4,-40,8,40); X.fillStyle='#8FB33A'; X.beginPath(); X.ellipse(0,-130,24,100,0,0,7); X.fill(); }
  else if(kind==='pine'){ X.fillStyle='#4A3826'; X.fillRect(-4,-20,8,20); X.fillStyle='#24543A'; for(let i=0;i<3;i++){ X.beginPath(); X.moveTo(-40+i*8,-20-i*40); X.lineTo(0,-90-i*40); X.lineTo(40-i*8,-20-i*40); X.fill(); } }
  else if(kind==='acacia'){ X.strokeStyle='#5B4632'; X.lineWidth=7; X.beginPath(); X.moveTo(0,0); X.lineTo(0,-70); X.lineTo(-30,-110); X.moveTo(0,-70); X.lineTo(30,-112); X.stroke(); X.fillStyle='#5E7A2E'; X.beginPath(); X.ellipse(0,-118,90,18,0,0,7); X.fill(); }
  else { const col={mango:'#2E6B2E',jacaranda:'#8E6BC9',oak:'#5A7A33',tree:'#6E8A3A',khejri:'#7C8F3E'}[kind]||'#4E7A35'; X.fillStyle='#5B4632'; X.fillRect(-6,-70,12,70); X.fillStyle=col; [[0,-110,60],[-40,-90,40],[40,-90,42],[0,-150,40]].forEach(([a,b,r])=>{ X.beginPath(); X.arc(a,b,r,0,7); X.fill(); }); }
  X.restore(); }
function backdrop(th,t){ sky(th.sky); sun(990,110,36);
  const f=th.far;

  const climate= c.climateKey ? c.climateKey : th.sea?'coastal' : (th.far==='dunes'||th.bldg==='warehouse')?'desert' : (th.far==='snowpeaks'||th.far==='alps')?'cold' : kind==='lights'?'lights' : th.far==='hills'?'hot' : 'tropical';

function thumb(cv,c){ const g=cv.getContext('2d'), w=cv.width, h=cv.height, th=c.theme; const sk=g.createLinearGradient(0,0,0,h*.6); sk.addColorStop(0,th.sky[0]); sk.addColorStop(1,th.sky[2]||th.sky[1]); g.fillStyle=sk; g.fillRect(0,0,w,h);
  const m=(window.SM_MOOD||{})[c.id]; g.fillStyle=m==='night'?'#F4F1E8':'#FFD36B'; g.beginPath(); g.arc(w*.82,h*.22,13,0,7); g.fill();
  if(th.sea){ g.fillStyle='#4F8FB8'; g.fillRect(0,h*.55,w*.35,h*.1); }
  if(th.far==='snowpeaks'||th.far==='alps'){ g.fillStyle='#8F9DB0'; g.beginPath(); g.moveTo(0,h*.6); g.lineTo(w*.25,h*.2); g.lineTo(w*.5,h*.6); g.lineTo(w*.75,h*.25); g.lineTo(w,h*.6); g.fill(); g.fillStyle='#FFFFFF'; g.beginPath(); g.moveTo(w*.2,h*.27); g.lineTo(w*.25,h*.2); g.lineTo(w*.3,h*.27); g.fill(); }
  if(th.far==='dunes'){ g.fillStyle='#E2C38C'; g.beginPath(); g.ellipse(w*.3,h*.62,w*.4,h*.15,0,Math.PI,0); g.fill(); }
  if(th.far==='city'){ g.fillStyle='#9DB4C8'; [[.05,.3],[.15,.45],[.27,.35],[.4,.55],[.55,.3],[.68,.4],[.8,.5]].forEach(([x,hh])=>g.fillRect(w*x,h*(.6-hh),w*.08,h*hh)); }
  if(th.far==='palms'){ g.strokeStyle='#5B4632'; g.lineWidth=4; [[.1,.25],[.88,.3]].forEach(([x,y])=>{ g.beginPath(); g.moveTo(w*x,h*.62); g.lineTo(w*x+6,h*y); g.stroke(); g.fillStyle='#2E6B2E'; g.beginPath(); g.ellipse(w*x+6,h*y,22,7,0,0,7); g.fill(); }); }
  g.fillStyle=th.ground; g.fillRect(0,h*.6,w,h*.4);
  const k=c.kind; g.fillStyle='#1E3A78';
  if(k==='pump'){ g.fillRect(w*.42,h*.42,w*.22,h*.08); g.fillStyle='#7A7A7A'; g.fillRect(w*.52,h*.5,4,h*.15); g.fillStyle='#2F5D9E'; g.fillRect(w*.7,h*.52,w*.08,h*.12); }
  else if(k==='lights'){ for(let i=0;i<5;i++){ g.fillStyle='#7A7F88'; g.fillRect(w*(.15+i*.17),h*.3,3,h*.35); g.fillStyle='#FFE9A8'; g.fillRect(w*(.15+i*.17)-6,h*.3,14,4); } }
  else if(k==='commercial'){ g.fillStyle='#C9CDD3'; g.fillRect(w*.25,h*.4,w*.5,h*.22); g.fillStyle='#1E3A78'; for(let i=0;i<6;i++) g.fillRect(w*(.27+i*.077),h*.36,w*.06,h*.04); }
  else if(k==='school'){ g.fillStyle='#F4EFE6'; g.fillRect(w*.25,h*.4,w*.5,h*.22); g.fillStyle='#8E2B2B'; g.fillRect(w*.24,h*.38,w*.52,h*.04); g.fillStyle='#1E3A78'; g.fillRect(w*.3,h*.33,w*.4,h*.05); }
  else { g.fillStyle=k==='hybrid'?'#EFE8D8':'#E9D6B0'; g.fillRect(w*.35,h*.42,w*.3,h*.2); g.fillStyle='#B5532F'; g.beginPath(); g.moveTo(w*.32,h*.42); g.lineTo(w*.5,h*.25); g.lineTo(w*.68,h*.42); g.fill(); g.fillStyle='#1E3A78'; g.fillRect(w*.42,h*.31,w*.14,h*.06); if(k==='hybrid'){ g.fillStyle='#10B981'; g.fillRect(w*.68,h*.52,w*.05,h*.1); } }
  if(m==='rain'||m==='storm'){ g.strokeStyle='rgba(220,235,250,.7)'; g.lineWidth=1; for(let i=0;i<40;i++){ const x=Math.random()*w, y=Math.random()*h; g.beginPath(); g.moveTo(x,y); g.lineTo(x-3,y+9); g.stroke(); } }
  if(m==='snow'){ g.fillStyle='#fff'; for(let i=0;i<40;i++){ g.beginPath(); g.arc(Math.random()*w,Math.random()*h,1.6,0,7); g.fill(); } }
  if(m==='night'){ g.fillStyle='rgba(8,14,40,.55)'; g.fillRect(0,0,w,h); }
  if(m==='dust'||m==='heat'){ g.fillStyle='rgba(220,160,90,.25)'; g.fillRect(0,0,w,h); }

  if(PK.step===1){ el.innerHTML=head+'<div class="tiles">'+REGIONS.map(([r,col,sub])=>{ const n=CASES.filter(c=>c.region===r).length, done=CASES.filter(c=>c.region===r&&rec[c.id]).length; return '<button class="tile" type="button" data-r="'+r+'"><div class="rg" style="background:linear-gradient(135deg,'+col+',#0B1424)"></div><b>'+r+'</b><small>'+sub+'</small><span class="st">'+done+' / '+n+' cases closed</span></button>'; }).join('')+'</div>';
    el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ sfx.click(); PK.region=b.dataset.r; PK.step=2; renderPick(); }); }
  else if(PK.step===2){ const list=CASES.filter(c=>c.region===PK.region); el.innerHTML=head+'<div class="tiles">'+list.map(c=>{ const r=rec[c.id]; const fl=((window.SM_FLOW||{})[c.kind]||[]).map(f=>f[1]); const tw=(window.SM_TWIST||{})[c.id]; return '<button class="tile case" type="button" data-c="'+c.id+'"><canvas class="thumb" width="320" height="150" data-th="'+c.id+'"></canvas><b>'+SS.esc(c.title)+'</b><small>'+SS.esc(c.place)+'</small><small>'+SS.esc(c.type)+' · '+c.level+'</small>'+(tw?'<small class="tw">Story: '+SS.esc(tw[0])+'</small>':'')+'<small class="fl">'+SS.esc(fl.slice(0,3).join(' → '))+' …</small><span class="st">'+(r?'★'.repeat(r.stars)+' best '+r.score:'New case')+'</span></button>'; }).join('')+'</div><button class="ss-btn alt sm" type="button" id="back" style="margin-top:12px">← Regions</button>';
    el.querySelectorAll('canvas[data-th]').forEach(cv=>thumb(cv,CASES.find(k=>k.id===cv.dataset.th))); el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ sfx.click(); PK.caseId=b.dataset.c; S.case=CASES.find(c=>c.id===PK.caseId); PK.step=3; renderPick(); renderSide(); }); document.getElementById('back').onclick=()=>{ PK.step=1; renderPick(); }; }
  else { el.innerHTML=head+'<p><b>'+SS.esc(S.case.title)+'</b> · '+SS.esc(S.case.place)+'</p><p class="ss-small">Only the roles that have a real job on this project are shown.</p><div class="tiles" id="roles"></div><label class="namefield" for="avname">Name your avatar<input id="avname" maxlength="20" placeholder="e.g. Asha"></label><div class="row" style="margin-top:12px"><button class="ss-btn alt sm" type="button" id="back">← Projects</button><button class="ss-btn" type="button" id="start" disabled>Start the case</button></div>';
    const rs=document.getElementById('roles'); const allowed=S.case.roles||ROLES.map(r=>r.id); if(S.role&&!allowed.includes(S.role.id)) S.role=null; ROLES.filter(r=>allowed.includes(r.id)).forEach(r=>{ const b=document.createElement('button'); b.className='tile'; b.type='button'; b.setAttribute('aria-pressed',S.role&&S.role.id===r.id?'true':'false'); b.innerHTML='<canvas></canvas><b>'+r.name+'</b><small>'+r.perk+'</small>'; rs.appendChild(b); portrait(b.querySelector('canvas'),r);
      b.onclick=()=>{ rs.querySelectorAll('.tile').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); S.role=r; document.getElementById('start').disabled=false; audio(); sfx.click(); }; });
    const ni=document.getElementById('avname'); ni.value=S.name||(SS.signedIn()?SS.me().name:''); if(S.role) document.getElementById('start').disabled=false;
    document.getElementById('back').onclick=()=>{ PK.step=2; renderPick(); };
    document.getElementById('start').onclick=()=>{ S.name=ni.value.trim()||(SS.signedIn()?SS.me().name:S.role.name); document.getElementById('picker').hidden=true; document.getElementById('stage').scrollIntoView({block:'start', behavior:'smooth'}); if(musicOn) startMusic(); begin(); }; }
}
renderPick(); renderSide();

/* ================= GAME FLOW ================= */
let siteH=null, roofH=null, safeH=null;
function begin(){ const c=S.case; S.rolePath=null; S.score=100; credits(0); S.clues=new Set(); S.chapter=-1; RG.sel.clear(); HAZ.forEach(h=>h.found=false); WZ.show=null; WZ.ok=false; OVTOP=false;
  FLOW=(window.SM_FLOW||{})[c.kind]||[['journey','Journey'],['site','Site investigation'],['size','Load analysis'],['shadow','Shadow study'],['wire','Electrical design'],['move','Transport and crew'],['safety','Safety walk'],['comm','Commissioning']];
  CH=FLOW.map(f=>f[1]); S.step=-1; renderSide(); next(); }
window.__next=()=>next();
const STEPS={journey:()=>ch1(), site:()=>ch2(), size:()=>ch3(), shadow:()=>ch4(), wire:()=>ch5(), move:()=>ch6(), safety:()=>ch7(), comm:()=>ch8(), twist:()=>twist()};
function next(){ S.step++; if(S.step>=FLOW.length){ rolePath(); return; } setChapter(S.step); OV.classList.remove('top'); STEPS[FLOW[S.step][0]](); }
const OPENERS={home:'Let’s go. I want to see the roof before we promise anything.',pump:'Let’s go to the fields. Water first, then panels.',lights:'Let’s meet the village and walk the road after dark.',commercial:'Let’s go. A big roof needs numbers before promises.',hybrid:'When the grid fails, people suffer. Let’s fix that properly.',school:'Let’s go. A school roof should power classes and teach too.'};
function twist(){ const tw=(window.SM_TWIST||{})[S.case.id]; if(!tw){ next(); return; } S.scene=S.case.kind==='pump'||S.case.kind==='lights'?'site':'road'; sfx.bad();
  story(tw[1], ()=>puzzle({tag:'twist', title:'Surprise: '+tw[0], q:tw[2], opts:tw[3], ok:0, hint:'Think about people, safety and what will still work in five years.', onOk:()=>{ credits(10); SS.badge('sm-twist','Problem Solver'); next(); }})); }
function ch1(){ S.scene='map'; S.mapT=0;
  story([S.case.intro[0],['you',OPENERS[S.case.kind]||'Let’s go. I want to see the site before we promise anything.']], ()=>{ OV.innerHTML=''; S.mapping=true; engine(true);
    onMapDone=()=>{ S.scene='road'; engine(true); setTimeout(()=>{ engine(false); next(); }, reduce?300:3200); }; }); }
function ch2(){ S.scene='site';
  story([S.case.intro[1],['you','Let me look around first. Every solar job starts as an investigation.']], ()=>{ OVTOP=true; say('you','Tap the glowing spots to collect clues. Find at least 5 of 6 to start the design.'); siteWait(); }); }
function siteWait(){ siteH=(x,y)=>{ for(const k of CLUEKEYS){ const h=sitePos(k); if(Math.hypot(x-h.x,y-h.y)<h.r+10){ if(!S.clues.has(k)){ S.clues.add(k); renderSide(); sfx.clue(); toast('Clue added to case file'); credits(5); if(S.clues.size===6) setTimeout(()=>SS.badge('sm-eye','Sharp Eye'),1200);
    const ln=S.case.clues[k][2]; say(ln[0],ln[1], S.clues.size>=5?[{label:'Start the design',go:()=>{ siteH=null; OVTOP=false; next(); }}]:[]); } return; } } }; }
function ch3(){ S.scene='desk'; const z=S.case.size; puzzle({tag:'size', title:'Size the system', q:z.q, opts:z.opts, ok:z.ok, hint:z.hint, onOk:()=>{ SS.badge('sm-size','Sizing Pro'); next(); }}); }
function ch4(){ S.scene='roof'; RG.sel.clear(); const L=S.case.layout;
  story([['you','Watch the shade move through the day. Place '+L.panels+' '+L.unit+(L.panels>1?'s':'')+' only where they get full sun from 9 am to 3 pm.']], ()=>{
    OV.innerHTML='<div class="puz"><h3>Shadow study</h3><div class="q">Tap squares to place '+L.panels+' '+L.unit+(L.panels>1?'s':'')+'. Avoid squares shaded before 3 pm and the blocked square.</div><div class="row"><button class="ss-btn sm" type="button" id="checkroof">Check layout</button><button class="ss-btn alt sm" type="button" id="hintroof">Hint'+(freeHint('shadow')?' (free)':' (−10)')+'</button><span class="hint" id="hr"></span></div></div>';
    document.getElementById('hintroof').onclick=e=>{ if(!freeHint('shadow')) credits(-10); document.getElementById('hr').textContent=(L.side==='west'?'The three left columns are shaded by 3 pm.':'The three right columns are shaded before 10 am.')+' Skip the '+L.block+' square too.'; e.target.disabled=true; };
    document.getElementById('checkroof').onclick=()=>{ if(RG.sel.size!==L.panels){ sfx.bad(); toast('Place exactly '+L.panels); return; } const bad=[...RG.sel].filter(k=>{ const [c,r]=k.split(',').map(Number); return badCell(c,r,L); });
      if(bad.length){ sfx.bad(); credits(-5); toast(bad.length+' in shade before 3 pm. Move them.'); } else { sfx.good(); credits(15); toast('Full sun 9 am–3 pm everywhere'); SS.badge('sm-shadow','Shadow Hunter'); roofH=null; setTimeout(next,1100); } };
    roofH=(x,y)=>{ const {cw,ch,x:gx,y:gy}=gridGeom(); const c=Math.floor((x-gx)/cw), r=Math.floor((y-gy)/ch); if(c<0||r<0||c>=L.cols||r>=L.rows||blocked(c,r,L)) return; const k=c+','+r; if(RG.sel.has(k)) RG.sel.delete(k); else if(RG.sel.size<L.panels) RG.sel.add(k); sfx.click(); };
  }); }
function ch5(){ S.scene='wiring'; WZ.show=null; WZ.ok=false; seq(S.case.wire,'wire',()=>{ SS.badge('sm-wire','Live Wire'); next(); }); }
function ch6(){ S.scene='road'; const c=S.case;
  story([['crew','Materials are ready. Check the forecast and tell me when we move.']], ()=>{ puzzle({tag:'road', title:'Plan the move', q:c.weather.q, opts:c.weather.opts, ok:c.weather.ok, hint:c.weather.hint, onOk:()=>puzzle({tag:'road', title:'Pick the crew', q:c.crew.q, opts:c.crew.opts, ok:c.crew.ok, hint:'Enough hands to lift safely, someone licensed for wiring, someone in charge.', onOk:next})}); }); }
function ch7(){ S.scene='safety'; HAZ.forEach(h=>h.found=false);
  story([['crew','Crew is on site. Before anyone climbs, do your safety walk.']], ()=>{ OV.classList.add('top');
    OV.innerHTML='<div class="puz"><h3>Spot the hazards</h3><div class="q">Tap the 4 unsafe things on site. <span id="hz">0 / 4 found</span></div><div class="row"><button class="ss-btn alt sm" type="button" id="hinthz">Hint'+(freeHint('safety')?' (free)':' (−10)')+'</button><span class="hint" id="hh"></span></div></div>';
    document.getElementById('hinthz').onclick=e=>{ if(!freeHint('safety')) credits(-10); document.getElementById('hh').textContent='Check the roof edge, the ladder, the sky and the inverter.'; e.target.disabled=true; };
    safeH=(x,y)=>{ const h=HAZ.find(h=>!h.found&&Math.hypot(x-h.x,y-h.y)<h.r+10); if(h){ h.found=true; sfx.good(); credits(8); toast(h.text); const n=HAZ.filter(z=>z.found).length; document.getElementById('hz').textContent=n+' / 4 found'; if(n===4){ safeH=null; SS.badge('sm-safe','Safe Hands'); setTimeout(next,1500);} } else { sfx.bad(); credits(-2); } }; }); }
function ch8(){ S.scene='finale'; S.finT=S.t+999; const steps=S.case.comm, order=[...steps].sort(()=>Math.random()-.5); let next=0;
  story([['inspector','I’m here for the final inspection. Show me you commissioned it in the right order.']], ()=>{
    OV.innerHTML='<div class="puz"><h3>Commission the system</h3><div class="q">Tap the steps in the order you do them. <span id="cs">Step 1 of '+steps.length+'</span></div><div class="opts" id="co"></div><div class="row"><button class="ss-btn alt sm" type="button" id="hintc">Hint'+(freeHint('comm')?' (free)':' (−10)')+'</button><span class="hint" id="hc"></span></div></div>';
    document.getElementById('hintc').onclick=e=>{ if(!freeHint('comm')) credits(-10); document.getElementById('hc').textContent='Look first, then measure, then test insulation and earth, then power up, then paperwork.'; e.target.disabled=true; };
    const co=document.getElementById('co'); order.forEach(s=>{ const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=s; b.onclick=()=>{ if(b.classList.contains('ok')) return; if(s===steps[next]){ b.classList.add('ok'); b.textContent=(next+1)+'. '+s; next++; sfx.good(); credits(4); document.getElementById('cs').textContent=next<steps.length?'Step '+(next+1)+' of '+steps.length:'Done'; if(next===steps.length) setTimeout(()=>window.__next(),900);} else { b.classList.add('no'); setTimeout(()=>b.classList.remove('no'),500); sfx.bad(); credits(-3);} }; co.appendChild(b); }); }); }
function win(){ S.finT=S.t; sfx.win(); const c=S.case; const stars=S.score>=175?3:S.score>=135?2:1;
  SS.record('mission',c.id,{stars,score:S.score,title:c.title}); SS.addXP(S.score); SS.cert({game:'mission',title:c.title+' · '+c.place.split(',').slice(-1)[0].trim(), name:S.name, role:S.role.name+(S.rolePath?' ('+S.rolePath+')':''), stars, score:S.score, detail:c.summary});
  const regionsDone=new Set(Object.keys(SS.records('mission')).map(id=>(CASES.find(k=>k.id===id)||{}).region)); if(regionsDone.size>=3) SS.badge('sm-globe','Globe Trotter');
  renderSide();
  story(c.outro, ()=>{ OV.innerHTML='<div class="puz"><h3>Case closed · Solar Project Passport issued</h3><div class="q"></div><div class="row"><button class="ss-btn sm" type="button" id="seecert">View certificate</button><button class="ss-btn alt sm" type="button" id="nextcase">Choose next case</button><button class="ss-btn alt sm" type="button" id="again">Replay</button></div></div>';
    OV.querySelector('.q').textContent=c.summary+'. Rating '+'★'.repeat(stars)+'☆'.repeat(3-stars)+' · '+S.score+' Solar Credits · '+S.clues.size+'/6 clues';
    document.getElementById('seecert').onclick=()=>{ const cs=SS.me().certs.filter(x=>x.game==='mission'); showCert(cs[cs.length-1]); };
    document.getElementById('again').onclick=()=>begin();
    document.getElementById('nextcase').onclick=()=>{ OV.innerHTML=''; S.scene='title'; PK.step=1; renderPick(); document.getElementById('picker').hidden=false; document.getElementById('chapname').textContent='Choose a case'; };
    if(!SS.signedIn()) setTimeout(()=>SS.toast('Create an account to keep this certificate'),1500); }); }
cv.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
  if(S.scene==='site'&&siteH) siteH(x,y); if(S.scene==='roof'&&roofH) roofH(x,y); if(S.scene==='safety'&&safeH) safeH(x,y); });
})();
</script>
