<style>
  :root { --navy:#0D1B34; --sun:#FDA604; --ray:#F99B02; --soft:#C9D2E3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background: radial-gradient(circle at 85% 10%, rgba(253,166,4,.35) 0%, rgba(249,155,2,.10) 28%, rgba(13,27,52,0) 55%), var(--navy);

  main { max-width: 640px; width:100%; text-align:center; }
  img { width: min(320px, 80vw); height:auto; margin-bottom: 40px; }
  .tag { display:inline-block; font-size:13px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--sun); border:1px solid rgba(253,166,4,.45); border-radius:999px; padding:6px 16px; margin-bottom:22px; }
  h1 { font-size: clamp(30px, 6vw, 46px); line-height:1.12; font-weight:700; letter-spacing:-.01em; }
  p { color:var(--soft); font-size: clamp(16px, 2.4vw, 19px); line-height:1.6; margin-top:18px; }
  .contact { margin-top:36px; font-size:16px; color:var(--soft); }

  <div class="contact">Questions, orders or partnerships:<br><b>sonofsurya15@gmail.com</b></div>
